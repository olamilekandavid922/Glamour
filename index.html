<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);

        }
        .container {
            width: 380px;
            background: #fff;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        .form {

            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 10px;
        }
        .container input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }
        .container button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #2563eb;
            color: #f8f4f4;
            border-radius: 8px;
            border: none; 
            cursor: pointer;
            transition: .3s
            
            ;           
        }
        .error {color: red;}
        .success {color: green;}

    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form class="form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="button">Log In</button>
            <p id="message"></p>
        </form>
    </div>

    <script>
        const text = document.getElementById("username") ;
        const Password = document.getElementById("password");
        const message = document.getElementById("message");
        const button = document.getElementById("button");

        const Validname = "Olamilekan David";
        const Validpass = "0987654321";

        button.addEventListener("click" , (e) => {
        e.preventDefault();
        if(text.value === Validname && Password.value === Validpass) {
            message.textContent = "Login Successful!";
            message.className = "success";
        }else{
            message.textContent = "Login Error, Try again!";
            message.className = "error";
        }
        }) 
    </script>
</body>
</html>
